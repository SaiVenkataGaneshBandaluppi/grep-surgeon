<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="20" fill="#1a1a2e"/>
  <!-- Magnifying glass handle -->
  <line x1="120" y1="120" x2="155" y2="155" stroke="#e94560" stroke-width="10" stroke-linecap="round"/>
  <!-- Magnifying glass circle -->
  <circle cx="85" cy="85" r="45" fill="none" stroke="#e94560" stroke-width="8"/>
  <!-- Scalpel handle -->
  <rect x="50" y="76" width="28" height="9" rx="4" fill="#8fa8c0"/>
  <!-- Scalpel blade body -->
  <polygon points="78,76 78,85 106,83 106,78" fill="#e8edf2"/>
  <!-- Scalpel cutting edge -->
  <line x1="78" y1="85" x2="106" y2="83" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/>
  <!-- Scalpel blade tip -->
  <polygon points="106,78 106,83 113,80" fill="#ffffff"/>
  <!-- Code lines - visible light blue -->
  <rect x="54" y="94" width="22" height="4" rx="2" fill="#5ba3f5" opacity="0.9"/>
  <rect x="54" y="102" width="34" height="4" rx="2" fill="#5ba3f5" opacity="0.7"/>
</svg>
